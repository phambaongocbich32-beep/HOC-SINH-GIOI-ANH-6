<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bồi dưỡng học sinh giỏi Tiếng Anh 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================
   Bồi dưỡng HSG Tiếng Anh 6 — Giao diện
   Bảng màu: navy sâu + vàng champagne + ngà (ivory)
   ========================================================== */
:root{
  --navy-900:#081a33;
  --navy-800:#0b1f3a;
  --navy-700:#13305a;
  --navy-500:#2a4a7c;
  --gold-600:#a9812c;
  --gold-500:#c9a24a;
  --gold-300:#ecd595;
  --gold-100:#fbf3dc;
  --ivory:#fbf8f1;
  --paper:#ffffff;
  --ink:#1b2333;
  --muted:#667085;
  --line:#eadcb8;

  /* màu chấm bài — tách bạch hoàn toàn */
  --ok:#17794f;          /* đúng: xanh ngọc */
  --ok-bg:#e6f6ee;
  --bad:#c0271d;         /* sai: đỏ */
  --bad-bg:#fdecea;
  --fix:#0f6b5c;         /* sửa lại: xanh lục đậm + nền mint */
  --fix-bg:#dff5ef;
  --expl:#1d4ed8;        /* giải thích: xanh dương */
  --expl-bg:#eaf1ff;

  --radius:18px;
  --shadow:0 12px 34px rgba(8,26,51,.09);
  --shadow-lg:0 22px 54px rgba(8,26,51,.22);
  --serif:"Playfair Display", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  line-height:1.65;
  font-size:16px;
  background:
    radial-gradient(1200px 600px at 10% -10%, #fff7e3 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #eef3fb 0%, transparent 55%),
    var(--ivory);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:28px 20px 56px}
a{color:var(--navy-700)}
h1,h2,h3{font-family:var(--serif);color:var(--navy-800);line-height:1.2;margin:0 0 .4em}
h1{font-size:clamp(28px,4vw,40px)}
h2{font-size:clamp(22px,3vw,28px)}
h3{font-size:19px}
p{margin:.5em 0}
[hidden]{display:none !important}

/* ---------- Thanh trên ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 28px;
  background:linear-gradient(120deg,var(--navy-900),var(--navy-700));
  border-bottom:1px solid var(--gold-500);
  box-shadow:0 6px 24px rgba(8,26,51,.25);
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.crest{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%, var(--gold-300), var(--gold-600));
  color:var(--navy-900);font-size:18px;box-shadow:0 0 0 3px rgba(201,162,74,.25);
}
.brand-text b{display:block;font-family:var(--serif);font-size:18px;letter-spacing:.3px;color:var(--gold-300)}
.brand-text small{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#c9d3e6}
.menu{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.menu a{
  color:#e6ecf7;text-decoration:none;font-weight:500;font-size:15px;
  padding:8px 14px;border-radius:999px;transition:.2s;
}
.menu a:hover,.menu a.active{background:rgba(201,162,74,.18);color:var(--gold-300)}
.ghost-link{
  background:none;border:1px solid rgba(236,213,149,.4);color:#c9d3e6;
  font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;margin-left:6px;
}
.ghost-link:hover{color:var(--gold-300);border-color:var(--gold-300)}

.foot{
  text-align:center;color:var(--muted);font-size:13px;padding:20px;
  border-top:1px solid var(--line);background:rgba(255,255,255,.5);
}

/* ---------- Thành phần chung ---------- */
.eyebrow{
  display:inline-block;font-size:12px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--gold-600);margin-bottom:6px;
}
.lead{color:var(--muted);font-size:16px;max-width:680px}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:var(--muted);font-size:14px}
.back:hover{color:var(--navy-700)}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;
  border:1px solid transparent;border-radius:999px;padding:11px 22px;transition:.2s;
}
.btn.primary{
  background:linear-gradient(120deg,var(--navy-800),var(--navy-700));
  color:var(--gold-300);box-shadow:0 8px 20px rgba(11,31,58,.25);
}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(11,31,58,.32);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--navy-700);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold-500);color:var(--gold-600)}
.btn.gold{background:linear-gradient(120deg,var(--gold-300),var(--gold-500));color:var(--navy-900)}

.fade-in{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none}}

/* ---------- Trang chủ ---------- */
.hero{
  position:relative;overflow:hidden;
  border-radius:24px;padding:48px 44px;color:#fff;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px),
    linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 62%, #1b3d6e 100%);
  box-shadow:var(--shadow-lg);
  border:1px solid rgba(201,162,74,.5);
}
.hero::after{
  content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(236,213,149,.35), transparent 70%);
}
.hero h1{color:#fff;font-size:clamp(30px,4.6vw,46px);max-width:700px}
.hero h1 em{color:var(--gold-300);font-style:normal}
.hero p{color:#d4dcec;max-width:640px;font-size:17px}
.hero .eyebrow{color:var(--gold-300)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;position:relative;z-index:1}
.stat{
  background:rgba(255,255,255,.07);border:1px solid rgba(236,213,149,.25);
  border-radius:16px;padding:14px 16px;
}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--gold-300);line-height:1.1}
.stat span{font-size:13px;color:#c9d3e6}

.section-title{margin:40px 0 16px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.quick-card{
  padding:28px;text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden;
  transition:.25s;background:linear-gradient(180deg,#fff,#fffdf7);
}
.quick-card::before{
  content:"";position:absolute;left:0;top:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300),var(--gold-600));
}
.quick-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--gold-500)}
.quick-card h2{margin:6px 0 8px}
.quick-card .go{color:var(--gold-600);font-weight:600}
.bigicon{font-family:var(--serif);font-size:44px;color:var(--gold-500);line-height:1}

/* ---------- Lưới thẻ ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{
  text-decoration:none;color:inherit;padding:20px 20px 18px;position:relative;
  transition:.22s;background:#fff;overflow:hidden;
}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold-500)}
.tile .num{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:18px;color:var(--gold-300);
  background:linear-gradient(135deg,var(--navy-800),var(--navy-500));
  margin-bottom:12px;
}
.tile h3{font-size:18px;margin:0 0 4px}
.tile .en{font-size:13px;color:var(--muted);min-height:20px}
.tile .meta{margin-top:12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{
  display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--gold-100);color:var(--gold-600);border:1px solid var(--line);
}
.pill.done{background:var(--ok-bg);color:var(--ok);border-color:#bfe6d2}
.pill.score-good{background:var(--ok-bg);color:var(--ok);border-color:#bfe6d2}
.pill.score-mid{background:#fff6dc;color:#8a6212;border-color:#f0dca4}
.pill.score-low{background:var(--bad-bg);color:var(--bad);border-color:#f5c2bd}
.mini{height:6px;background:#f1ead8;border-radius:99px;overflow:hidden;margin-top:12px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));border-radius:99px;transition:width .6s}

/* ---------- Trang chuyên đề ---------- */
.chead{
  padding:30px 32px;border-radius:var(--radius);color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--navy-900),var(--navy-700));
  border:1px solid rgba(201,162,74,.5);box-shadow:var(--shadow);
}
.chead .cnum{color:var(--gold-300);font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.chead h1{color:#fff;font-size:clamp(26px,3.6vw,36px);margin:4px 0}
.chead .cen{color:#c9d3e6;font-style:italic;font-family:var(--serif);font-size:18px}
.chead .big-dec{
  position:absolute;right:24px;top:10px;font-family:var(--serif);font-size:120px;color:rgba(236,213,149,.08);line-height:1;
}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.tab{
  font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;
  padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s;position:relative;
}
.tab:hover{color:var(--navy-700)}
.tab.active{background:linear-gradient(120deg,var(--navy-800),var(--navy-700));color:var(--gold-300);box-shadow:0 6px 16px rgba(11,31,58,.22)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.tab .dot.bad{background:var(--bad)}

.panel{margin-top:18px;animation:fadeUp .35s ease both}
.theory .block{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:16px;box-shadow:var(--shadow);
  position:relative;
}
.theory .block::before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;
  background:linear-gradient(var(--gold-300),var(--gold-600));
}
.theory .block h3{color:var(--navy-800);margin-bottom:8px}
.theory .block ul{margin:8px 0 8px 20px;padding:0}
.theory .block li{margin:4px 0}
.formula{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;
  background:var(--navy-800);color:var(--gold-300);padding:12px 16px;border-radius:12px;margin:10px 0;overflow-x:auto;
}
.examples{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex-row{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.ex-row:nth-child(odd){background:#fffdf7}
.ex-row div{padding:10px 14px;border-top:1px solid var(--line)}
.ex-row .en{font-weight:600;color:var(--navy-800)}
.ex-row .vi{color:var(--muted);border-left:1px solid var(--line)}
.warn{
  margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff6dc;border:1px solid #f0dca4;color:#6b4e0c;font-size:15px;
}

.ex-title{margin:0 0 4px}
.ex-sub{color:var(--muted);margin-bottom:14px;font-size:15px}
.ex-form{display:flex;flex-direction:column;gap:14px}
.item{
  display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px;
  box-shadow:0 4px 14px rgba(8,26,51,.05);transition:border-color .2s, background .2s;
}
.item .qno{
  flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;color:var(--navy-900);
  background:linear-gradient(135deg,var(--gold-300),var(--gold-500));
}
.item .qbody{flex:1;min-width:0}
.qtext{font-size:16.5px;margin:4px 0 10px;color:var(--ink)}
.qtext u{text-decoration:underline;text-decoration-color:var(--gold-600);text-decoration-thickness:2px;text-underline-offset:3px}
.hint{font-size:13.5px;color:var(--muted);margin:-4px 0 10px;font-style:italic}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  cursor:pointer;background:#fffdf8;transition:.15s;position:relative;
}
.opt:hover{border-color:var(--gold-500);background:var(--gold-100)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .letter{
  flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;
  background:#f1ead8;color:var(--navy-700);
}
.opt:has(input:checked){border-color:var(--navy-700);background:#eef3fb;box-shadow:inset 0 0 0 1px var(--navy-700)}
.opt:has(input:checked) .letter{background:var(--navy-700);color:var(--gold-300)}
.opt.locked{cursor:default;pointer-events:none}
.opt.right{background:var(--ok-bg);border:2px solid var(--ok);color:var(--ok);font-weight:600}
.opt.right .letter{background:var(--ok);color:#fff}
.opt.right::after{content:"✔";margin-left:auto;font-weight:700}
.opt.wrong{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad)}
.opt.wrong .otext{text-decoration:line-through;text-decoration-thickness:2px}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.wrong::after{content:"✘";margin-left:auto;font-weight:700}

.txt{
  width:100%;max-width:560px;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;
  border:1.5px solid #d9cba6;background:#fffdf8;color:var(--ink);transition:.2s;
}
.txt:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 4px rgba(19,48,90,.12);background:#fff}
.txt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.txt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.txt:disabled{cursor:default}

/* Phản hồi */
.fb:empty{display:none}
.fb{margin-top:12px;animation:pop .35s ease both}
.fb-ok{
  background:var(--ok-bg);border:1px solid #b9e3cc;border-left:5px solid var(--ok);border-radius:12px;padding:10px 14px;
}
.fb-ok .praise{color:var(--ok);font-weight:700}
.fb-bad{
  background:#fff;border:1px solid #f3c7c2;border-left:5px solid var(--bad);border-radius:12px;padding:10px 14px;
}
.line{margin:4px 0;font-size:15px}
.line .tag{
  display:inline-block;min-width:98px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
}
.wrongline{color:var(--bad)}
.wrongline s{text-decoration-thickness:2px}
.rightline{color:var(--fix);background:var(--fix-bg);border-radius:8px;padding:4px 8px;display:inline-block;margin-top:6px}
.rightline .tag{color:var(--fix)}
.expl{
  margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--expl-bg);color:#1c3c75;font-size:15px;
  border-left:3px solid var(--expl);
}
.expl b{color:var(--expl)}
.fb-ok .expl{background:#f2f8f5;color:#225540;border-left-color:var(--ok)}
.fb-ok .expl b{color:var(--ok)}

.item.ok{border-color:#b9e3cc}
.item.bad{border-color:#f3c7c2}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
.summary{
  display:flex;gap:18px;align-items:center;margin-top:18px;padding:18px 22px;border-radius:var(--radius);
  background:linear-gradient(120deg,#fff,#fffaf0);border:1px solid var(--gold-500);box-shadow:var(--shadow);
  animation:pop .4s ease both;
}
.summary.low{border-color:#f3c7c2;background:linear-gradient(120deg,#fff,#fff5f4)}
.sbig{
  font-family:var(--serif);font-size:44px;font-weight:700;color:var(--navy-800);min-width:96px;text-align:center;line-height:1;
}
.sbig span{font-size:18px;color:var(--muted)}
.smsg{font-weight:600;color:var(--navy-800);font-size:17px}
.sbar{height:10px;background:#f1ead8;border-radius:99px;overflow:hidden;margin:8px 0 4px;min-width:220px}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5fc79a);border-radius:99px}
.summary.low .sbar i{background:linear-gradient(90deg,var(--bad),#f08a80)}
.summary small{color:var(--muted)}

/* ---------- Đề thi ---------- */
.test-bar{
  position:sticky;top:78px;z-index:15;margin:18px 0 6px;padding:12px 18px;border-radius:999px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.timer{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--navy-800);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad)}
.progress-txt{font-size:14px;color:var(--muted)}
.sec{margin-top:26px}
.sec-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px 20px;border-radius:var(--radius);color:#fff;
  background:linear-gradient(120deg,var(--navy-800),var(--navy-500));border:1px solid rgba(201,162,74,.5);
}
.sec-head h2{color:#fff;font-size:21px;margin:0}
.sec-head small{color:#d4dcec;font-size:14px}
.sec-head .pts{background:var(--gold-300);color:var(--navy-900);font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
.note{color:var(--muted);font-size:14px;margin:12px 4px 4px}
.passage{
  background:#fffdf7;border:1px solid var(--line);border-left:4px solid var(--gold-500);border-radius:14px;
  padding:18px 20px;margin:14px 0;font-size:16px;line-height:1.85;white-space:pre-line;
}
.score-card{
  padding:26px;margin-top:18px;border:1px solid var(--gold-500);
  background:linear-gradient(135deg,#fff,#fffaf0);border-radius:22px;box-shadow:var(--shadow-lg);
  animation:pop .45s ease both;
}
.score-card .total{
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
.bigscore{font-family:var(--serif);font-size:72px;font-weight:700;line-height:1;color:var(--navy-800)}
.bigscore span{font-size:26px;color:var(--muted)}
.grade{
  display:inline-block;padding:6px 16px;border-radius:999px;font-weight:700;color:var(--navy-900);
  background:linear-gradient(120deg,var(--gold-300),var(--gold-500));
}
.secscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.secscore{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.secscore b{font-family:var(--serif);font-size:22px;color:var(--navy-800)}
.secscore small{display:block;color:var(--muted);font-size:13px}
.toggle{
  display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--navy-700);cursor:pointer;user-select:none;
}
.toggle input{accent-color:var(--navy-700);width:16px;height:16px}
.results-only .item.ok{display:none}

/* ---------- Di động ---------- */
@media (max-width:820px){
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .stats{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:1fr}
  .hero{padding:32px 24px}
  .chead{padding:24px 22px}
  .chead .big-dec{font-size:90px}

          { t: "mcq", q: "How old is Mimi?", o: ["one year old", "two years old", "three years old", "five years old"], a: 1, e: "Bài đọc: Mimi hai tuổi." },
          { t: "mcq", q: "Where does Lan take Mimi every morning?", o: ["to school", "to the park near her house", "to the market", "to the beach"], a: 1, e: "Bài đọc: Lan dắt Mimi đi dạo ở công viên gần nhà." },
          { t: "mcq", q: "What does Mimi like to do?", o: ["sleep all day", "run after the ball and bark at birds", "swim in the river", "climb trees"], a: 1, e: "Bài đọc: Mimi thích đuổi theo quả bóng và sủa chim." },

        ] },
        { key: "IV", name: "Writing", vi: "Viết lại câu", pts: 4, note: WR_NOTE, items: [
          { t: "text", q: "Viết lại với Let's: We could have a picnic in the park.", a: "Let's have a picnic in the park.", alt: ["Let's have a picnic in the park"], e: "Let's + V nguyên mẫu để đề nghị cùng làm." },
          { t: "text", q: "Viết lại câu với cùng nghĩa: Mimi is friendlier than my cat.", a: "My cat isn't as friendly as Mimi.", alt: ["My cat is not as friendly as Mimi."], e: "Ý ngược lại: mèo của tôi không thân thiện bằng Mimi → isn't as friendly as." },

        { key: "IV", name: "Writing", vi: "Viết lại câu", pts: 4, note: WR_NOTE, items: [
          { t: "text", q: "Viết lại với câu điều kiện loại 2: I don't have a car, so I can't drive to the village.", a: "If I had a car, I could drive to the village.", alt: ["If I had a car, I would drive to the village."], e: "Giả định trái với hiện tại: If + quá khứ đơn, could/would + V." },
          { t: "text", q: "Viết lại với Let's: We could go fishing this afternoon.", a: "Let's go fishing this afternoon.", alt: ["Let's go fishing this afternoon"], e: "Let's + V nguyên mẫu." },
          { t: "text", q: "Viết lại câu với cùng nghĩa: The last time I saw my cousin was in 2020.", hint: "Dùng hiện tại hoàn thành phủ định với since.", a: "I haven't seen my cousin since 2020.", alt: ["I have not seen my cousin since 2020."], e: "Từ 2020 đến nay chưa gặp → haven't seen … since 2020." },
          { t: "text", q: "Viết lại với Could you: Please tell me a story about the village.", a: "Could you tell me a story about the village?", alt: ["Could you tell me a story about the village"], e: "Could you + V nguyên mẫu để nhờ vả lịch sự." }
        ] }
      ]
    },

    {
      id: 15, title: "Đề tham khảo số 15", sub: "Phát âm · Từ vựng & Ngữ pháp · Đọc hiểu · Viết",
      sections: [
        { key: "I", name: "Phonetics", vi: "Phát âm và trọng âm", pts: 1, note: PH_NOTE, items: [
          { t: "mcq", q: "Choose the word whose underlined part is pronounced differently.", o: ["<u>ph</u>one", "<u>ph</u>oto", "<u>sh</u>ark", "<u>ph</u>rase"], a: 2, e: "Phone, photo, phrase đọc là /f/; shark đọc là /ʃ/." },
          { t: "mcq", q: "Choose the word whose underlined part is pronounced differently.", o: ["r<u>oa</u>d", "b<u>oa</u>t", "g<u>oa</u>t", "b<u>oo</u>k"], a: 3, e: "Road, boat, goat đọc là /əʊ/; book đọc là /ʊ/." },
          { t: "mcq", q: "Choose the word whose stress pattern is different.", o: ["SIN-ger", "MAR-ket", "PO-ny", "be-LOW"], a: 3, e: "“Below” nhấn âm tiết thứ hai; ba từ còn lại nhấn âm tiết thứ nhất." },
          { t: "mcq", q: "Choose the word whose stress pattern is different.", o: ["com-PLETE", "CAN-dy", "BOT-tle", "FAM-i-ly"], a: 0, e: "“Complete” nhấn âm tiết thứ hai; ba từ còn lại nhấn âm tiết thứ nhất." }
        ] },
        { key: "II", name: "Vocabulary & Grammar", vi: "Từ vựng và ngữ pháp", pts: 3, note: VG_NOTE, items: [
          { t: "mcq", q: "The children ____ in the garden right now.", o: ["are playing", "play", "plays", "played"], a: 0, e: "“Right now” → hiện tại tiếp diễn: are playing." },
          { t: "mcq", q: "My mother ____ to work by motorbike every day.", o: ["goes", "go", "going", "gone"], a: 0, e: "Chủ ngữ my mother số ít, thói quen → goes." },
          { t: "mcq", q: "I ____ my new bag last Friday.", o: ["bought", "buy", "buys", "buying"], a: 0, e: "“Last Friday” là quá khứ; buy → bought." },
          { t: "mcq", q: "There is ____ water in the glass. Please fill it up.", o: ["little", "a little", "many", "few"], a: 0, e: "Water không đếm được; ý là còn rất ít, cần thêm → little." },
          { t: "mcq", q: "Which is ____ city in Vietnam?", o: ["the biggest", "bigger", "big", "more big"], a: 0, e: "So sánh nhất với “the” → the biggest." },
          { t: "mcq", q: "We ____ our homework yet. We're going to do it tonight.", o: ["haven't finished", "didn't finish", "don't finish", "won't finish"], a: 0, e: "Yet với hiện tại hoàn thành (phủ định): haven't finished." },
          { t: "mcq", q: "____ you ever ____ a horse?", o: ["Have / ridden", "Did / ride", "Do / ride", "Have / rode"], a: 0, e: "Kinh nghiệm với ever: Have + S + ever + V3 (ridden)." },
          { t: "mcq", q: "If I ____ a teacher, I would help students every day.", o: ["were", "am", "was", "be"], a: 0, e: "Câu điều kiện loại 2 với be: dùng were." },
          { t: "mcq", q: "You ____ speak loudly in the hospital. It's a rule.", o: ["mustn't speak", "don't have to speak", "shouldn't to speak", "may speak"], a: 0, e: "Quy định cấm → mustn't speak." },
          { t: "mcq", q: "____ does the bus leave? At 6:15.", o: ["What time", "Who", "Why", "Where"], a: 0, e: "Hỏi về thời gian → What time." }
        ] },
        { key: "III", name: "Reading", vi: "Đọc hiểu", pts: 2, note: RD_NOTE,
          passage: "Da Nang has a famous night market by the river. It opens every evening from six o'clock until midnight. Visitors can buy clothes, toys and souvenirs. The smell of grilled fish and fresh spring rolls fills the air. Children laugh and play games at the small stalls. My family goes there on Friday nights because the food is cheap and delicious. I always buy a hat for my little brother.",
          items: [
          { t: "mcq", q: "Where is the night market?", o: ["in Hanoi", "by the river in Da Nang", "on the mountain", "in a shopping mall"], a: 1, e: "Bài đọc: chợ đêm nằm bên sông ở Đà Nẵng." },
          { t: "mcq", q: "When does the market open?", o: ["at noon", "every evening from six o'clock", "only on Sundays", "at four in the morning"], a: 1, e: "Bài đọc: mở cửa mỗi tối từ 6 giờ." },
          { t: "mcq", q: "What can visitors buy?", o: ["cars", "clothes, toys and souvenirs", "computers", "furniture"], a: 1, e: "Bài đọc: du khách có thể mua quần áo, đồ chơi và quà lưu niệm." },
          { t: "mcq", q: "What fills the air?", o: ["the sound of music", "the smell of grilled fish and spring rolls", "cold wind", "smoke from cars"], a: 1, e: "Bài đọc: mùi cá nướng và chả giò tươi lan khắp không khí." },
          { t: "mcq", q: "Why does the writer's family go there on Friday nights?", o: ["because the food is cheap and delicious", "because the market is far away", "because they sell cars", "because it is closed"], a: 0, e: "Bài đọc: đồ ăn rẻ và ngon." },
          { t: "mcq", q: "What does the writer always buy there?", o: ["a toy", "a hat for the writer's little brother", "a bag", "a book"], a: 1, e: "Bài đọc: tác giả luôn mua một chiếc mũ cho em trai." }
        ] },
        { key: "IV", name: "Writing", vi: "Viết lại câu", pts: 4, note: WR_NOTE, items: [
          { t: "text", q: "Viết lại với may: Perhaps it will be cold tonight.", a: "It may be cold tonight.", alt: ["It might be cold tonight."], e: "Khả năng có thể xảy ra → may (hoặc might)." },
          { t: "text", q: "Viết câu cảm thán: The night market is extremely crowded!", a: "How crowded the night market is!", alt: ["How crowded the night market is"], e: "Extremely + tính từ → How + tính từ + S + V!" },
          { t: "text", q: "Viết lại với Why don't you: You should buy a hat for your brother.", a: "Why don't you buy a hat for your brother?", alt: ["Why don't you buy a hat for your brother"], e: "Why don't you + V nguyên mẫu để gợi ý." },
          { t: "text", q: "Viết lại câu với cùng nghĩa: The market is more crowded on Friday than on Monday.", a: "The market isn't as crowded on Monday as on Friday.", alt: ["The market is not as crowded on Monday as on Friday."], e: "Ý ngược lại: thứ Hai không đông bằng thứ Sáu → isn't as crowded … as." }
        ] }
      ]
    }

  ]);
})();

</script>
  <script>
/* ==========================================================
   Bồi dưỡng HSG Tiếng Anh 6 — logic ứng dụng
   - Chuyên đề: lý thuyết + 5 bài tập / chuyên đề
   - Đề thi: 4 phần, tổng 10 điểm, có đồng hồ 60 phút
   - Chấm: đúng → khen; sai → gạch đỏ + sửa xanh + giải thích
   ========================================================== */
(function () {
  'use strict';

  var KEY = 'hsg-anh6-progress-v1';
  var CD = window.CHUYEN_DE || [];
  var DT = window.DE_THI || [];
  var TEST_MINUTES = 60;

  var PRAISE = [
    'Chính xác! Bạn làm rất tốt.',
    'Tuyệt vời! Bạn đã nắm vững điểm này.',
    'Xuất sắc! Tư duy của bạn rất logic.',
    'Đúng rồi! Bạn đang tiến bộ từng ngày.',
    'Rất giỏi! Giữ vững phong độ nhé.',
    'Chuẩn không cần chỉnh! Quá ấn tượng.'
  ];

  var progress = load();
  var timerId = null;

  /* ---------- Tiện ích ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function app() { return document.getElementById('app'); }

  function load() {
    try {
      var p = JSON.parse(localStorage.getItem(KEY));
      return (p && typeof p === 'object') ? Object.assign({ ch: {}, de: {} }, p) : { ch: {}, de: {} };
    } catch (e) { return { ch: {}, de: {} }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) { /* bỏ qua */ } }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // So khớp linh hoạt: không phân biệt hoa/thường, bỏ dấu câu, chuẩn hoá khoảng trắng
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[‘’ʼ`]/g, "'")
      .replace(/[.,!?;:"“”()]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function isRight(it, val) {
    var list = [].concat(it.a, it.alt || []).map(norm);
    return list.indexOf(norm(val)) >= 0;
  }
  function primary(it) { return [].concat(it.a)[0]; }
  function randPraise() { return PRAISE[Math.floor(Math.random() * PRAISE.length)]; }
  function pct(c, t) { return t ? Math.round(c / t * 100) : 0; }
  function round2(x) { return Math.round(x * 100) / 100; }

  function gradeLabel(s) {
    if (s >= 9) return 'Xuất sắc';
    if (s >= 8) return 'Giỏi';
    if (s >= 6.5) return 'Khá';
    if (s >= 5) return 'Trung bình';
    return 'Cần cố gắng thêm';
  }

  /* ---------- Hiển thị câu hỏi ---------- */
  function itemsHTML(items, pfx) {
    return items.map(function (it, i) {
      var uid = pfx + '-' + i;
      var hint = it.hint ? '<div class="hint">Gợi ý: ' + it.hint + '</div>' : '';
      var body;
      if (it.t === 'mcq') {
        body = '<p class="qtext">' + it.q + '</p>' + hint +
          '<div class="opts">' + it.o.map(function (o, j) {
            return '<label class="opt"><input type="radio" name="' + uid + '" value="' + j + '">' +
              '<span class="letter">' + 'ABCD'.charAt(j) + '</span><span class="otext">' + o + '</span></label>';
          }).join('') + '</div>';
      } else {
        body = '<p class="qtext">' + it.q + '</p>' + hint +
          '<input class="txt" type="text" name="' + uid + '" autocomplete="off" spellcheck="false" placeholder="Viết câu trả lời…">';
      }
      return '<article class="item" data-uid="' + uid + '">' +
        '<div class="qno">' + (i + 1) + '</div>' +
        '<div class="qbody">' + body + '<div class="fb"></div></div></article>';
    }).join('');
  }

  /* ---------- Chấm câu hỏi ---------- */
  function okHTML(it) {
    return '<div class="fb-ok"><div class="praise">✔ ' + randPraise() + '</div>' +
      (it.e ? '<div class="expl"><b>Ghi nhớ:</b> ' + it.e + '</div>' : '') + '</div>';
  }
  function badHTML(it, shown) {
    var isMcq = it.t === 'mcq';
    var mine = shown === '' ? '<i>Chưa trả lời</i>' : (isMcq ? shown : esc(shown));
    var right = isMcq ? ('ABCD'.charAt(it.a) + '. ' + it.o[it.a]) : esc(primary(it));
    return '<div class="fb-bad">' +
      '<div class="line wrongline"><span class="tag">✘ Bạn ghi</span> <s>' + mine + '</s></div>' +
      '<div class="line rightline"><span class="tag">✔ Sửa lại</span> <b>' + right + '</b></div>' +
      (it.e ? '<div class="expl"><b>Giải thích:</b> ' + it.e + '</div>' : '') +
      '</div>';
  }

  // Chấm một nhóm câu hỏi trong root, trả về số câu đúng
  function gradeItems(items, pfx, root) {
    var correct = 0;
    items.forEach(function (it, i) {
      var uid = pfx + '-' + i;
      var el = root.querySelector('.item[data-uid="' + uid + '"]');
      if (!el || el.classList.contains('graded')) return;
      el.classList.add('graded');
      var fb = el.querySelector('.fb');
      var ok = false, shown = '';
      if (it.t === 'mcq') {
        var sel = el.querySelector('input:checked');
        var v = sel ? parseInt(sel.value, 10) : -1;
        ok = (v === it.a);
        var opts = el.querySelectorAll('.opt');
        opts[it.a].classList.add('right');
        if (v >= 0 && !ok) opts[v].classList.add('wrong');
        opts.forEach(function (o) { o.classList.add('locked'); });
        shown = v >= 0 ? it.o[v] : '';
      } else {
        var inp = el.querySelector('input.txt');
        shown = inp.value.trim();
        ok = isRight(it, shown);
        inp.classList.add(ok ? 'good' : 'bad');
      }
      $$('input', el).forEach(function (x) { x.disabled = true; });
      el.classList.add(ok ? 'ok' : 'bad');
      if (ok) correct++;
      fb.innerHTML = ok ? okHTML(it) : badHTML(it, shown);
    });
    return correct;
  }

  function summaryHTML(c, t) {
    var p = pct(c, t);
    var msg;
    if (p === 100) msg = '🏆 Hoàn hảo! Bạn đã làm đúng tất cả.';
    else if (p >= 75) msg = '🌟 Rất tốt! Chỉ cần xem lại vài chỗ nhỏ.';
    else if (p >= 50) msg = '👍 Khá lắm! Hãy đọc kỹ phần giải thích ở các câu sai.';
    else msg = '💪 Đừng nản! Đọc lại lý thuyết và giải thích rồi làm lại nhé.';
    return '<div class="summary ' + (p >= 50 ? '' : 'low') + ' fade-in">' +
      '<div class="sbig">' + c + '<span>/' + t + '</span></div>' +
      '<div><div class="smsg">' + msg + '</div>' +
      '<div class="sbar"><i style="width:' + p + '%"></i></div>' +
      '<small>Đúng ' + p + '% · Sai ' + (t - c) + ' câu</small></div></div>';
  }

  /* ---------- Lý thuyết ---------- */
  function theoryHTML(blocks) {
    return blocks.map(function (b) {
      var h = '<section class="block"><h3>' + b.h + '</h3>';
      if (b.p) h += '<p>' + b.p + '</p>';
      if (b.f) h += '<div class="formula">' + b.f + '</div>';
      if (b.ul) h += '<ul>' + b.ul.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
      if (b.ex) {
        h += '<div class="examples">' + b.ex.map(function (r) {
          return '<div class="ex-row"><div class="en">' + r[0] + '</div><div class="vi">' + r[1] + '</div></div>';
        }).join('') + '</div>';
      }
      if (b.warn) h += '<div class="warn"><b>⚠ Lưu ý:</b> ' + b.warn + '</div>';
      return h + '</section>';
    }).join('');
  }

  /* ---------- Trang chủ ---------- */
  function renderHome() {
    var totalItems = 0;
    CD.forEach(function (c) { c.ex.forEach(function (e) { totalItems += e.items.length; }); });
    var doneTests = Object.keys(progress.de).length;
    var doneCh = Object.keys(progress.ch).length;
    app().innerHTML =
      '<section class="hero fade-in">' +
        '<span class="eyebrow">Luyện thi học sinh giỏi · Tiếng Anh lớp 6</span>' +
        '<h1>Bồi dưỡng học sinh giỏi <em>Tiếng Anh 6</em></h1>' +
        '<p>Học chắc ngữ pháp qua từng chuyên đề, luyện tập có chấm điểm tức thì, rồi thử sức với các đề thi tham khảo theo đúng cấu trúc phần Phát âm, Từ vựng – Ngữ pháp, Đọc hiểu và Viết.</p>' +
        '<div class="stats">' +
          '<div class="stat"><b>' + CD.length + '</b><span>Chuyên đề ngữ pháp</span></div>' +
          '<div class="stat"><b>' + DT.length + '</b><span>Đề thi tham khảo</span></div>' +
          '<div class="stat"><b>' + totalItems + '</b><span>Câu luyện tập</span></div>' +
          '<div class="stat"><b>' + doneCh + '/' + CD.length + '</b><span>Chuyên đề đã luyện</span></div>' +
        '</div>' +
      '</section>' +
      '<div class="quick">' +
        '<a class="card quick-card fade-in" href="#/chuyen">' +
          '<div class="bigicon">I</div><h2>Các chuyên đề ngữ pháp</h2>' +
          '<p class="lead">Lý thuyết có ví dụ song ngữ, 5 bài tập mỗi chuyên đề, chấm ngay và giải thích từng câu sai.</p>' +
          '<span class="go">Bắt đầu học →</span></a>' +
        '<a class="card quick-card fade-in" href="#/de">' +
          '<div class="bigicon">II</div><h2>Đề thi tham khảo</h2>' +
          '<p class="lead">Mỗi đề gồm 4 phần, tổng 10 điểm, có đồng hồ 60 phút. Nộp bài để xem điểm và đáp án chi tiết.</p>' +
          '<span class="go">Làm đề thi →</span></a>' +
      '</div>' +
      '<div class="section-title"><h2>Bạn đã làm được gì?</h2>' +
        '<span class="lead">Tiến độ được lưu trong trình duyệt của bạn (đã đạt ' + doneTests + '/' + DT.length + ' đề).</span></div>' +
      '<div class="grid">' + CD.slice(0, 6).map(chapterTile).join('') + '</div>';
  }

  function chapterTile(c) {
    var p = progress.ch[c.id];
    var done = p && p.ex ? Object.keys(p.ex).length : 0;
    var dt = done ? '<span class="pill done">' + done + '/' + c.ex.length + ' bài</span>' : '<span class="pill">Chưa làm</span>';
    return '<a class="card tile fade-in" href="#/chuyen/' + c.id + '">' +
      '<div class="num">' + c.id + '</div><h3>' + c.title + '</h3><div class="en">' + c.en + '</div>' +
      '<div class="meta">' + dt + '<span>Lý thuyết + ' + c.ex.length + ' bài</span></div>' +
      '<div class="mini"><i style="width:' + Math.round(done / c.ex.length * 100) + '%"></i></div></a>';
  }

  /* ---------- Danh sách chuyên đề ---------- */
  function renderChuyenList() {
    app().innerHTML =
      '<div class="section-title" style="margin-top:0"><div><span class="eyebrow">Phần A</span><h1>Các chuyên đề ngữ pháp</h1>' +
      '<p class="lead">Mỗi chuyên đề gồm phần lý thuyết và 5 bài tập. Chọn một chuyên đề để bắt đầu.</p></div></div>' +
      '<div class="grid">' + CD.map(chapterTile).join('') + '</div>';
  }

  /* ---------- Chi tiết chuyên đề ---------- */
  function renderChuyen(id) {
    var c = CD.filter(function (x) { return x.id === id; })[0];
    if (!c) return renderNotFound();
    var tabs = '<button class="tab active" data-tab="0">Lý thuyết</button>' +
      c.ex.map(function (e, k) {
        var saved = progress.ch[c.id] && progress.ch[c.id].ex && progress.ch[c.id].ex[k];
        var dot = saved ? '<span class="dot ' + (saved.c === saved.t && saved.t > 0 ? '' : (saved.c / saved.t >= 0.5 ? '' : 'bad')) + '"></span>' : '';
        return '<button class="tab" data-tab="' + (k + 1) + '">Bài tập ' + (k + 1) + dot + '</button>';
      }).join('');
    var panels = '<section class="panel theory" data-panel="0">' + theoryHTML(c.theory) + '</section>' +
      c.ex.map(function (e, k) {
        var pfx = 'cd' + c.id + '-e' + k;
        return '<section class="panel card" data-panel="' + (k + 1) + '" hidden data-cd="' + c.id + '" data-k="' + k + '" style="padding:24px">' +
          '<h2 class="ex-title">' + e.title + '</h2>' +
          (e.note ? '<p class="ex-sub">' + e.note + '</p>' : '') +
          '<form class="ex-form" onsubmit="return false">' + itemsHTML(e.items, pfx) + '</form>' +
          '<div class="actions">' +
            '<button class="btn primary submit" type="button">Chấm bài này</button>' +
            '<button class="btn ghost retry" type="button">Làm lại</button>' +
          '</div>' +
          '<div class="result"></div></section>';
      }).join('');

    app().innerHTML =
      '<a class="back" href="#/chuyen">← Tất cả chuyên đề</a>' +
      '<header class="chead fade-in"><div class="big-dec" aria-hidden="true">' + c.id + '</div>' +
        '<div class="cnum">Chuyên đề ' + c.id + '</div>' +
        '<h1>' + c.title + '</h1><div class="cen">' + c.en + '</div></header>' +
      '<nav class="tabs" id="tabs">' + tabs + '</nav>' +
      '<div id="panels">' + panels + '</div>';
  }

  /* ---------- Danh sách đề thi ---------- */
  function renderDeList() {
    app().innerHTML =
      '<div class="section-title" style="margin-top:0"><div><span class="eyebrow">Phần B</span><h1>Đề thi tham khảo</h1>' +
      '<p class="lead">Mỗi đề: I. Phát âm (1,0 đ) · II. Từ vựng &amp; Ngữ pháp (3,0 đ) · III. Đọc hiểu (2,0 đ) · IV. Viết (4,0 đ). Thời gian 60 phút.</p></div></div>' +
      '<div class="grid">' + DT.map(function (d) {
        var p = progress.de[d.id];
        var pill = p ? '<span class="pill ' + (p.best >= 8 ? 'score-good' : p.best >= 5 ? 'score-mid' : 'score-low') + '">Cao nhất: ' + p.best + '/10</span>' : '<span class="pill">Chưa làm</span>';
        return '<a class="card tile fade-in" href="#/de/' + d.id + '">' +
          '<div class="num">' + d.id + '</div><h3>' + d.title + '</h3><div class="en">' + d.sub + '</div>' +
          '<div class="meta">' + pill + '<span>24 câu · 10 điểm</span></div></a>';
      }).join('') + '</div>';
  }

  /* ---------- Đề thi ---------- */
  function renderDe(id) {
    var d = DT.filter(function (x) { return x.id === id; })[0];
    if (!d) return renderNotFound();
    stopTimer();
    var n = 0;
    d.sections.forEach(function (s) { n += s.items.length; });
    app().innerHTML =
      '<a class="back" href="#/de">← Tất cả đề thi</a>' +
      '<header class="chead fade-in"><div class="big-dec" aria-hidden="true">' + d.id + '</div>' +
        '<div class="cnum">Đề thi tham khảo</div><h1>' + d.title + '</h1><div class="cen">' + d.sub + '</div></header>' +
      '<div class="test-bar" id="testBar">' +
        '<div class="timer" id="timer">' + pad(TEST_MINUTES) + ':00</div>' +
        '<div class="progress-txt" id="prog">Đã làm 0/' + n + ' câu</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn primary" id="submitTest" type="button">Nộp bài</button>' +
        '</div></div>' +
      '<div id="testResult"></div>' +
      '<form id="testForm" onsubmit="return false">' +
        d.sections.map(function (s, si) {
          return '<section class="sec fade-in" data-sec="' + si + '">' +
            '<div class="sec-head"><div><h2>' + s.key + '. ' + s.name + '</h2><small>' + s.vi + '</small></div>' +
            '<span class="pts">' + s.pts + ' điểm · ' + s.items.length + ' câu</span></div>' +
            (s.note ? '<p class="note">' + s.note + '</p>' : '') +
            (s.passage ? '<div class="passage">' + s.passage + '</div>' : '') +
            '<div class="ex-form" style="margin-top:14px">' + itemsHTML(s.items, 'de' + d.id + '-s' + si) + '</div>' +
          '</section>';
        }).join('') +
      '</form>';

    var secsLeft = TEST_MINUTES * 60;
    var t0 = Date.now();
    timerId = setInterval(function () {
      var left = TEST_MINUTES * 60 - Math.floor((Date.now() - t0) / 1000);
      var el = $('#timer');
      if (!el) return stopTimer();
      el.textContent = fmt(Math.max(left, 0));
      el.classList.toggle('warn', left <= 300);
      if (left <= 0) { stopTimer(); submitTest(d); }
    }, 1000);
    el('#timer').textContent = fmt(secsLeft);

    $('#testForm').addEventListener('input', function () { updateProgress(d); });
    $('#testForm').addEventListener('change', function () { updateProgress(d); });
    $('#submitTest').addEventListener('click', function () {
      if (confirm('Nộp bài ngay? Sau khi nộp, bạn sẽ xem điểm và đáp án chi tiết.')) submitTest(d);
    });
  }
  function el(sel) { return $(sel); }
  function pad(m) { return (m < 10 ? '0' : '') + m; }
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return pad(m) + ':' + (s < 10 ? '0' : '') + s;
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function updateProgress(d) {
    var n = 0, total = 0;
    d.sections.forEach(function (s, si) {
      s.items.forEach(function (it, i) {
        total++;
        var uid = 'de' + d.id + '-s' + si + '-' + i;
        var node = $('.item[data-uid="' + uid + '"]');
        if (!node) return;
        if (it.t === 'mcq' ? node.querySelector('input:checked') : (node.querySelector('input.txt').value.trim() !== '')) n++;
      });
    });
    var p = $('#prog');
    if (p) p.textContent = 'Đã làm ' + n + '/' + total + ' câu';
  }

  function submitTest(d) {
    stopTimer();
    var btn = $('#submitTest');
    if (btn) { btn.disabled = true; btn.textContent = 'Đã nộp'; }
    var root = $('#testForm');
    var total = 0, secRows = [], correctTotal = 0, rows = [];
    d.sections.forEach(function (s, si) {
      var c = gradeItems(s.items, 'de' + d.id + '-s' + si, root);
      var score = s.items.length ? (c / s.items.length) * s.pts : 0;
      total += score;
      correctTotal += c;
      secRows.push({ key: s.key, name: s.name, c: c, n: s.items.length, pts: s.pts, score: score });
    });
    total = round2(total);
    var prev = progress.de[d.id] || { best: 0, n: 0 };
    progress.de[d.id] = { best: Math.max(prev.best || 0, total), last: total, n: (prev.n || 0) + 1, when: Date.now() };
    save();

    var tr = $('#testResult');
    tr.innerHTML =
      '<div class="score-card fade-in">' +
        '<div class="total">' +
          '<div class="bigscore">' + total + '<span>/10</span></div>' +
          '<div><span class="grade">' + gradeLabel(total) + '</span>' +
            '<p class="lead" style="margin:10px 0 0">Đúng ' + correctTotal + '/' + secRows.reduce(function (a, r) { return a + r.n; }, 0) +
            ' câu. ' + (total >= 8 ? 'Bài làm rất tốt, hãy thử đề khác để giữ phong độ!' :
              total >= 5 ? 'Đọc kỹ giải thích các câu sai rồi làm lại để tiến bộ rõ rệt.' :
              'Hãy ôn lại chuyên đề tương ứng và thử lại — mỗi lần làm là một bước tiến.') + '</p></div>' +
        '</div>' +
        '<div class="secscores">' + secRows.map(function (r) {
          return '<div class="secscore"><small>' + r.key + '. ' + r.name + '</small><b>' + round2(r.score) + '</b><small>/' + r.pts + ' điểm · đúng ' + r.c + '/' + r.n + '</small></div>';
        }).join('') + '</div>' +
        '<div class="actions">' +
          '<label class="toggle"><input type="checkbox" id="onlyWrong"> Chỉ xem câu sai</label>' +
          '<button class="btn ghost" type="button" id="retryTest">Làm lại đề này</button>' +
        '</div>' +
      '</div>';

    var form = $('#testForm');
    $('#onlyWrong').addEventListener('change', function (e) { form.classList.toggle('results-only', e.target.checked); });
    $('#retryTest').addEventListener('click', function () { renderDe(d.id); window.scrollTo(0, 0); });
    tr.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $$('input', form).forEach(function (x) { x.disabled = true; });
  }

  /* ---------- Trang không tồn tại ---------- */
  function renderNotFound() {
    app().innerHTML = '<div class="card" style="padding:30px"><h2>Không tìm thấy nội dung</h2><p><a href="#/">Quay về trang chủ</a></p></div>';
  }

  /* ---------- Định tuyến ---------- */
  function route() {
    var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
    stopTimer();
    $$('.menu a[data-nav]').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === parts[0]);
    });
    if (parts[0] === 'chuyen' && parts[1]) renderChuyen(parseInt(parts[1], 10));
    else if (parts[0] === 'chuyen') renderChuyenList();
    else if (parts[0] === 'de' && parts[1]) renderDe(parseInt(parts[1], 10));
    else if (parts[0] === 'de') renderDeList();
    else if (parts[0] === '' ) renderHome();
    else renderNotFound();
    window.scrollTo(0, 0);
  }

  /* ---------- Sự kiện (ủy quyền) ---------- */
  app().addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (tab) {
      $$('.tab', $('#tabs')).forEach(function (t) { t.classList.toggle('active', t === tab); });
      var idx = tab.getAttribute('data-tab');
      $$('#panels > .panel').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== idx; });
      return;
    }

    var submit = e.target.closest('.submit');
    if (submit) {
      var panel = submit.closest('.panel');
      var cdId = parseInt(panel.getAttribute('data-cd'), 10);
      var k = parseInt(panel.getAttribute('data-k'), 10);
      var c = CD.filter(function (x) { return x.id === cdId; })[0];
      var ex = c.ex[k];
      var correct = gradeItems(ex.items, 'cd' + cdId + '-e' + k, panel.querySelector('.ex-form'));
      if (!progress.ch[cdId]) progress.ch[cdId] = { ex: {} };
      if (!progress.ch[cdId].ex) progress.ch[cdId].ex = {};
      var prev = progress.ch[cdId].ex[k];
      if (!prev || correct >= prev.c) progress.ch[cdId].ex[k] = { c: correct, t: ex.items.length };
      save();
      panel.querySelector('.result').innerHTML = summaryHTML(correct, ex.items.length);
      submit.disabled = true;
      // cập nhật chấm trên thanh tab
      var tabBtn = $('#tabs .tab[data-tab="' + (k + 1) + '"]');
      if (tabBtn) {
        var dot = tabBtn.querySelector('.dot');
        if (!dot) { dot = document.createElement('span'); dot.className = 'dot'; tabBtn.appendChild(dot); }
        dot.classList.toggle('bad', correct / ex.items.length < 0.5);
      }
      panel.querySelector('.result').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    var retry = e.target.closest('.retry');
    if (retry) {
      var p2 = retry.closest('.panel');
      var cd2 = CD.filter(function (x) { return x.id === parseInt(p2.getAttribute('data-cd'), 10); })[0];
      var k2 = parseInt(p2.getAttribute('data-k'), 10);
      var pfx2 = 'cd' + cd2.id + '-e' + k2;
      p2.querySelector('.ex-form').innerHTML = itemsHTML(cd2.ex[k2].items, pfx2);
      p2.querySelector('.result').innerHTML = '';
      p2.querySelector('.submit').disabled = false;
      return;
    }
  });

  // Nhập liệu trong bài tập chuyên đề: cho phép Enter để chấm nhanh không cần thiết — giữ đơn giản
  window.addEventListener('hashchange', route);

  $('#resetBtn').addEventListener('click', function () {
    if (confirm('Xóa toàn bộ tiến độ đã lưu trên trình duyệt này?')) {
      progress = { ch: {}, de: {} };
      save();
      route();
    }
  });

  route();
})();

</script>
</body>
</html>
